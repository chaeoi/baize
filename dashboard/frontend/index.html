<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15191e">
  <title>EchoBot 机器人监控</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="login-view" class="login-view hidden">
    <form id="login-form" class="login-form">
      <div class="brand-mark" aria-hidden="true"><i data-lucide="activity"></i></div>
      <h1>EchoBot</h1>
      <p>机器人监控面板</p>
      <input name="username" type="text" value="admin" autocomplete="username" hidden>
      <label for="password">管理密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="button primary full" type="submit"><i data-lucide="log-in"></i><span>登录</span></button>
      <div id="login-error" class="form-error" role="alert"></div>
    </form>
  </div>

  <div id="app-view" class="app-shell hidden">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"><i data-lucide="activity"></i></span><strong>EchoBot</strong><span>机器人监控</span></div>
      <div class="topbar-actions">
        <span id="clock" class="clock"></span>
        <button id="refresh-button" class="icon-button" type="button" title="刷新"><i data-lucide="refresh-cw"></i></button>
        <button id="release-button" class="button subtle" type="button"><i data-lucide="package"></i><span>版本</span></button>
        <button id="logout-button" class="icon-button" type="button" title="退出"><i data-lucide="log-out"></i></button>
      </div>
    </header>

    <div class="workspace">
      <aside class="fleet-sidebar">
        <div class="sidebar-heading">
          <div><span class="eyebrow">机器人</span><strong id="robot-count">0 台</strong></div>
          <div id="online-count" class="online-count">0 在线</div>
        </div>
        <div class="search-wrap"><i data-lucide="search"></i><input id="robot-search" type="search" placeholder="搜索编码、主机或备注" aria-label="搜索机器人"></div>
        <div id="robot-list" class="robot-list"></div>
      </aside>

      <main class="main-content">
        <section id="empty-state" class="empty-state">
          <i data-lucide="bot"></i><strong>暂无机器人数据</strong><span>等待 agent 首次上报</span>
        </section>

        <div id="robot-detail" class="robot-detail hidden">
          <section class="robot-header">
            <div class="robot-heading">
              <div class="status-beacon" id="detail-beacon"></div>
              <div><div class="title-line"><h1 id="robot-code">-</h1><span id="robot-status" class="status-label">离线</span></div><div id="robot-identity" class="identity-line"></div></div>
            </div>
            <div class="header-actions">
              <button id="remark-button" class="button subtle" type="button"><i data-lucide="pencil"></i><span>备注</span></button>
              <button id="update-button" class="button primary" type="button"><i data-lucide="download"></i><span>更新 Agent</span></button>
            </div>
          </section>

          <section class="meta-strip">
            <div><span>备注</span><strong id="robot-remark">-</strong></div>
            <div><span>Agent</span><strong id="agent-version">-</strong></div>
            <div><span>目标版本</span><strong id="desired-version">跟随配置</strong></div>
            <div><span>最后上报</span><strong id="last-seen">-</strong></div>
          </section>

          <nav class="tabs" aria-label="机器人数据视图">
            <button class="tab active" data-tab="overview" type="button">概览</button>
            <button class="tab" data-tab="motors" type="button">电机 <span id="motor-count">0</span></button>
            <button class="tab" data-tab="diagnostics" type="button">诊断 <span id="error-count">0</span></button>
          </nav>

          <div id="tab-overview" class="tab-view">
            <section class="metric-grid">
              <article class="metric-block"><div class="metric-label"><i data-lucide="cpu"></i><span>CPU</span></div><strong id="cpu-value">-</strong><div class="meter"><span id="cpu-meter"></span></div><small id="cpu-sub">-</small></article>
              <article class="metric-block"><div class="metric-label"><i data-lucide="memory-stick"></i><span>内存</span></div><strong id="memory-value">-</strong><div class="meter"><span id="memory-meter"></span></div><small id="memory-sub">-</small></article>
              <article class="metric-block"><div class="metric-label"><i data-lucide="gauge"></i><span>GPU</span></div><strong id="gpu-value">-</strong><div class="meter"><span id="gpu-meter"></span></div><small id="gpu-sub">-</small></article>
              <article class="metric-block battery"><div class="metric-label"><i data-lucide="battery-charging"></i><span>电池</span></div><strong id="battery-value">-</strong><div class="meter"><span id="battery-meter"></span></div><small id="battery-sub">-</small></article>
            </section>

            <section class="data-columns">
              <div class="data-section">
                <div class="section-heading"><h2>主控状态</h2><i data-lucide="server"></i></div>
                <dl id="system-facts" class="fact-list"></dl>
              </div>
              <div class="data-section">
                <div class="section-heading"><h2>温度</h2><i data-lucide="thermometer"></i></div>
                <div id="temperature-list" class="temperature-list"></div>
              </div>
              <div class="data-section">
                <div class="section-heading"><h2>BMS</h2><i data-lucide="battery-medium"></i></div>
                <dl id="bms-facts" class="fact-list"></dl>
              </div>
            </section>
          </div>

          <div id="tab-motors" class="tab-view hidden">
            <section class="motor-summary">
              <div><span>数据源</span><strong id="motor-source">-</strong></div>
              <div><span>Topic</span><strong id="motor-topic">-</strong></div>
              <div><span>Topic 状态</span><strong id="motor-topic-state">-</strong></div>
              <div><span>采样时间</span><strong id="motor-sampled">-</strong></div>
            </section>
            <div id="motor-limit" class="capability-note"></div>
            <div class="table-wrap">
              <table><thead><tr><th>电机</th><th>关节</th><th>品牌 / 型号</th><th>CAN</th><th>模式</th><th>位置 rad</th><th>速度 rad/s</th><th>估算扭矩 Nm</th></tr></thead><tbody id="motor-table"></tbody></table>
            </div>
          </div>

          <div id="tab-diagnostics" class="tab-view hidden">
            <div id="diagnostic-list" class="diagnostic-list"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <dialog id="remark-dialog">
    <form id="remark-form" class="dialog-form">
      <div class="dialog-heading"><div><span class="eyebrow">机器人备注</span><h2 id="remark-dialog-title">编辑备注</h2></div><button class="icon-button dialog-close" type="button" title="关闭"><i data-lucide="x"></i></button></div>
      <label for="remark-input">备注</label><textarea id="remark-input" maxlength="200" rows="4"></textarea>
      <div class="dialog-actions"><button class="button subtle dialog-close" type="button">取消</button><button class="button primary" type="submit"><i data-lucide="save"></i><span>保存</span></button></div>
    </form>
  </dialog>

  <dialog id="update-dialog">
    <form id="update-form" class="dialog-form">
      <div class="dialog-heading"><div><span class="eyebrow">Agent 更新</span><h2 id="update-dialog-title">指定版本</h2></div><button class="icon-button dialog-close" type="button" title="关闭"><i data-lucide="x"></i></button></div>
      <label for="update-version">版本</label><select id="update-version" required></select>
      <div class="dialog-actions"><button id="clear-update-button" class="button danger" type="button"><i data-lucide="rotate-ccw"></i><span>清除指定</span></button><span class="action-spacer"></span><button class="button subtle dialog-close" type="button">取消</button><button class="button primary" type="submit"><i data-lucide="download"></i><span>下发更新</span></button></div>
    </form>
  </dialog>

  <dialog id="release-dialog" class="wide-dialog">
    <div class="dialog-form">
      <div class="dialog-heading"><div><span class="eyebrow">版本仓库</span><h2>Agent 二进制</h2></div><button class="icon-button dialog-close" type="button" title="关闭"><i data-lucide="x"></i></button></div>
      <form id="release-form" class="upload-form">
        <label>版本<input name="version" placeholder="1.0.0" required></label>
        <label>系统<select name="os"><option value="linux">linux</option></select></label>
        <label>架构<select name="arch"><option value="arm64">arm64</option><option value="amd64">amd64</option></select></label>
        <label class="file-label">二进制<input name="binary" type="file" required></label>
        <button class="button primary" type="submit"><i data-lucide="upload"></i><span>上传</span></button>
      </form>
      <div id="release-list" class="release-list"></div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="/vendor/lucide.min.js"></script>
  <script src="/app.js" defer></script>
</body>
</html>
