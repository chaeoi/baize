dashboard:
  # Agent token and JWT secret are generated on first startup.
  agent_token: ""
  admin_user: "admin"
  # Bootstrap password. The first authenticated session must replace it.
  admin_password: "Baize@Admin1"
  password_change_required: true
  jwt_secret: ""
  listen: ":8080"
  # Copy data_dir (and releases) when migrating the dashboard. History is disposable.
  data_dir: "/data/control"
  history_data_dir: "/data/history"
  history_retention: 2160h
  history_sample_interval: 1m
  frontend_dir: "/opt/baize/dashboard/frontend"
  # Enable when HTTPS reaches this process or a trusted reverse proxy terminates TLS.
  cookie_secure: false
