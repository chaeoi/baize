name: 发布 Docker 镜像

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - dashboard/backend/**
      - dashboard/frontend/**
      - dashboard/config.yml.example
      - shared/model/**
      - shared/rawstream/**
      - shared/robotmodel/**
      - .github/workflows/docker-publish.yml

permissions:
  contents: read

jobs:
  publish:
    name: 构建并发布镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 读取发布版本
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=dev
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            version="$RELEASE_VERSION"
            [[ "$version" =~ ^[2-9][0-9]{3}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]
          fi
          image_name="${DOCKERHUB_USERNAME:-${GITHUB_REPOSITORY_OWNER,,}}/baize"
          {
            echo "version=$version"
            echo "image_name=$image_name"
            echo 'tags<<IMAGE_TAGS'
            echo "$image_name:$version"
            echo IMAGE_TAGS
          } >> "$GITHUB_OUTPUT"

      - name: 校验 Docker Hub 密钥
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 检查已发布镜像
        id: existing
        if: github.event_name != 'pull_request'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
          RELEASE_VERSION: ${{ steps.image.outputs.version }}
        run: |
          inspection="$RUNNER_TEMP/baize-image-inspection.log"
          if docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_VERSION" >/dev/null 2>"$inspection"; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          elif grep -Eq '(: not found|manifest unknown|name unknown)(:|$)' "$inspection"; then
            echo 'found=false' >> "$GITHUB_OUTPUT"
          else
            cat "$inspection" >&2
            exit 1
          fi

      - name: 构建镜像并发布
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dashboard/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
