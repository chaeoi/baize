name: 构建并发布 Agent

on:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - agent/cmd/**
      - agent/internal/**
      - agent/deploy/**
      - agent/ros2_subscriber/**
      - shared/model/**
      - shared/robotmodel/**
      - .github/workflows/agent-release.yml
  workflow_dispatch:

concurrency:
  group: agent-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  go-test:
    name: 测试 Go Agent
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 设置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: 测试
        run: |
          go test ./...
          go vet ./...

  build-agent:
    name: 构建 Linux Agent (${{ matrix.arch }})
    needs: [go-test, build-subscriber]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 设置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 下载对应架构的 ROS2 Subscriber
        uses: actions/download-artifact@v7
        with:
          name: baize-subscriber-${{ matrix.arch }}
          path: subscriber-dist

      - name: 嵌入 ROS2 Subscriber
        run: |
          cp "subscriber-dist/baize-ros2-subscriber-linux-${{ matrix.arch }}" \
            agent/internal/service/baize-ros2-subscriber

      - name: 计算日期版本
        id: version
        run: |
          set -euo pipefail
          agent_paths=(go.mod go.sum agent/cmd agent/internal agent/deploy agent/ros2_subscriber shared/model shared/robotmodel .github/workflows/agent-release.yml)
          commit_date="$(git log -1 --format=%cI "$GITHUB_SHA" -- "${agent_paths[@]}")"
          echo "version=$(date -u -d "$commit_date" +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 构建静态 Agent
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build \
            -trimpath -buildvcs=false -tags netgo,osusergo \
            -ldflags="-s -w -buildid= -X main.version=$VERSION" \
            -o "dist/baize-agent-linux-$GOARCH" ./agent/cmd/baize-agent
          if [ "$GOARCH" = "$(go env GOHOSTARCH)" ]; then
            "dist/baize-agent-linux-$GOARCH" -version
          else
            file "dist/baize-agent-linux-$GOARCH"
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: baize-agent-${{ matrix.arch }}
          path: dist/baize-agent-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  build-subscriber:
    name: 构建 ROS2 C++ Subscriber (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ros:humble-ros-base-jammy
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 安装构建依赖
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ros-humble-ament-cmake ros-humble-rclcpp \
            ros-humble-sensor-msgs ros-humble-diagnostic-msgs
      - name: 构建 C++ Subscriber
        run: |
          set -euo pipefail
          . /opt/ros/humble/setup.sh
          cmake -S agent/ros2_subscriber -B build/baize-ros2-subscriber -DCMAKE_BUILD_TYPE=Release
          cmake --build build/baize-ros2-subscriber --parallel
          mkdir -p dist
          cp build/baize-ros2-subscriber/baize-ros2-subscriber dist/baize-ros2-subscriber-linux-${{ matrix.arch }}
          ldd dist/baize-ros2-subscriber-linux-${{ matrix.arch }} | tee dist/ldd-${{ matrix.arch }}.txt
          ! grep -q 'not found' dist/ldd-${{ matrix.arch }}.txt
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: baize-subscriber-${{ matrix.arch }}
          path: dist/baize-ros2-subscriber-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布 GitHub Release
    needs: [build-agent, build-subscriber]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 下载 Agent 构建产物
        uses: actions/download-artifact@v7
        with:
          pattern: baize-*
          merge-multiple: true
          path: dist

      - name: 计算版本并生成校验和
        id: version
        run: |
          set -euo pipefail
          agent_paths=(go.mod go.sum agent/cmd agent/internal agent/deploy agent/ros2_subscriber shared/model shared/robotmodel .github/workflows/agent-release.yml)
          commit_date="$(git log -1 --format=%cI "$GITHUB_SHA" -- "${agent_paths[@]}")"
          version="$(date -u -d "$commit_date" +%Y%m%d)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum baize-agent-linux-* baize-ros2-subscriber-linux-* > SHA256SUMS)

      - name: 移动日期标签
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ref="refs/tags/$VERSION"
          if gh api --silent "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$VERSION" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="$ref" -f sha="$GITHUB_SHA" >/dev/null
          fi

      - name: 发布 Agent Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release delete "$VERSION" --yes
          fi
          gh release create "$VERSION" \
            dist/baize-agent-linux-amd64 \
            dist/baize-agent-linux-arm64 \
            dist/baize-ros2-subscriber-linux-amd64 \
            dist/baize-ros2-subscriber-linux-arm64 \
            dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Baize Agent $VERSION" \
            --notes "白泽 Agent 日期版本 $VERSION。\n\n包含 Linux AMD64/ARM64 静态 Agent、ROS2 C++ Subscriber 和 SHA256SUMS。配置示例保留在源码仓库中。" \
            --latest
