name: 自动发布 Baize

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: baize-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  version:
    name: 自动编号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.number.outputs.version }}
      released: ${{ steps.number.outputs.released }}
      latest: ${{ steps.number.outputs.latest }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 计算版本并创建标签
        id: number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 - <<'PYCODE'
          import datetime
          import json
          import os
          import re
          import subprocess


          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()


          def month(date):
              value = datetime.datetime.fromisoformat(date).astimezone(datetime.timezone.utc)
              return f"{value.year}.{value.month}"


          def release(path):
              result = subprocess.run(["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/{path}"], text=True, capture_output=True)
              if result.returncode:
                  if "HTTP 404" in result.stderr:
                      return None
                  raise RuntimeError(result.stderr)
              return json.loads(result.stdout)


          head = os.environ["GITHUB_SHA"]
          history = [line.split() for line in git("log", "--first-parent", "--format=%H %cI", head).splitlines()]
          prefix = month(history[0][1])
          pattern = re.compile(re.escape(prefix) + r"\.([1-9][0-9]*)")
          tags = {}
          for line in git("for-each-ref", "--format=%(refname:strip=2) %(objectname) %(*objectname)", "refs/tags").splitlines():
              name, target, *peeled = line.split()
              match = pattern.fullmatch(name)
              if match:
                  commit = peeled[0] if peeled else target
                  tags[commit] = max(tags.get(commit, 0), int(match[1]))
          sequence = 0
          for commit, date in history:
              if commit in tags:
                  sequence += tags[commit]
                  break
              sequence += month(date) == prefix
          if not 0 < sequence <= 4294967295:
              raise RuntimeError("release sequence is out of range")
          version = f"{prefix}.{sequence}"
          reference = subprocess.run(["git", "rev-parse", "--verify", f"refs/tags/{version}^{{commit}}"], text=True, capture_output=True)
          if reference.returncode == 0:
              if reference.stdout.strip() != head:
                  raise RuntimeError(f"release tag {version} already belongs to another commit")
          else:
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subject = git("show", "-s", "--format=%s", head)
              subprocess.run(["git", "tag", "-a", "--cleanup=verbatim", version, head, "-m", f"## 更新内容\n\n- {subject}\n"], check=True)
              subprocess.run(["git", "push", "origin", f"refs/tags/{version}"], check=True)
          existing = release(f"tags/{version}")
          if existing and existing["draft"]:
              subprocess.run(["gh", "release", "delete", version, "--repo", os.environ["GITHUB_REPOSITORY"], "--yes"], check=True)
              existing = None
          latest = release("latest")
          promote = not latest or tuple(map(int, version.split("."))) > tuple(map(int, latest["tag_name"].split(".")))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\nreleased={str(bool(existing)).lower()}\nlatest={str(promote).lower()}\n")
          print(f"Release version: {version}")
          PYCODE

  go-test:
    name: 测试 Go Agent
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 设置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: 测试
        run: |
          go test ./...
          go vet ./...

  build-agent:
    name: 构建 Linux Agent (${{ matrix.arch }})
    needs: [version, go-test]
    if: needs.version.outputs.released != 'true'
    env:
      VERSION: ${{ needs.version.outputs.version }}
    runs-on: ${{ matrix.runner }}
    container: ros:humble-ros-base-jammy
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装构建依赖
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ros-humble-ament-cmake ros-humble-rclcpp \
            ros-humble-sensor-msgs ros-humble-diagnostic-msgs

      - name: 设置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建静态 Agent
        shell: bash
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          set -eo pipefail
          . /opt/ros/humble/setup.bash
          cmake -S agent/ros2_subscriber -B "$RUNNER_TEMP/baize-ros2-subscriber" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/baize-ros2-subscriber" --parallel
          subscriber="$RUNNER_TEMP/baize-ros2-subscriber/baize-ros2-subscriber"
          ldd "$subscriber" | tee "$RUNNER_TEMP/baize-ros2-subscriber-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/baize-ros2-subscriber-ldd.txt"; then
            exit 1
          fi
          cp "$subscriber" agent/internal/service/baize-ros2-subscriber
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux go build \
            -trimpath -buildvcs=false -tags netgo,osusergo \
            -ldflags="-s -w -buildid= -X main.version=$VERSION" \
            -o "dist/baize-agent-linux-$GOARCH" ./agent/cmd/baize-agent
          "dist/baize-agent-linux-$GOARCH" -version

      - name: 上传 Agent
        uses: actions/upload-artifact@v7
        with:
          name: baize-agent-${{ matrix.arch }}
          path: dist/baize-agent-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  dashboard:
    name: 发布 Dashboard
    needs: [version, go-test]
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
      latest: ${{ needs.version.outputs.latest == 'true' }}
    secrets: inherit

  release:
    name: 发布 GitHub Release
    needs: [version, build-agent, dashboard]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH_LATEST: ${{ needs.version.outputs.latest }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 下载 Agent 构建产物
        uses: actions/download-artifact@v7
        with:
          pattern: baize-agent-*
          merge-multiple: true
          path: dist

      - name: 生成校验和
        run: |
          set -euo pipefail
          (cd dist && sha256sum baize-agent-linux-* > SHA256SUMS)

      - name: 发布 Agent Release
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          if [ "$(git cat-file -t "$VERSION")" = tag ]; then
            git for-each-ref --format='%(contents)' "refs/tags/$VERSION" > "$notes"
          else
            printf 'Baize %s 正式版。\n' "$VERSION" > "$notes"
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION"
          image="${DOCKERHUB_USERNAME:-${GITHUB_REPOSITORY_OWNER,,}}/baize:$VERSION"
          {
            printf '\n## 安装与升级\n\n'
            printf -- '- Dashboard 镜像：\140%s\140\n' "$image"
            printf -- '- Agent 安装、配置和服务管理：[部署文档](https://github.com/%s/blob/%s/README.md#agent)。\n' "$GITHUB_REPOSITORY" "$VERSION"
            printf '\n## 下载\n\n'
            printf '| Linux 架构 | Agent |\n|---|---|\n'
            for arch in amd64 arm64; do
              printf '| %s | [baize-agent-linux-%s](%s/baize-agent-linux-%s) |\n' "$arch" "$arch" "$base" "$arch"
            done
            printf '\nAgent 已内嵌 ROS2 订阅器。机器人需要 ROS2 Humble 运行环境。\n'
            printf '\n## SHA-256\n\n下载附件 \140SHA256SUMS\140 后，可用 \140sha256sum --check --ignore-missing SHA256SUMS\140 校验。\n\n\140\140\140text\n'
            cat dist/SHA256SUMS
            printf '\140\140\140\n'
          } >> "$notes"
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [[ "$previous" =~ ^[2-9][0-9]{3}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]] && [ "$previous" != "$VERSION" ]; then
            printf '\n' >> "$notes"
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$VERSION" -f previous_tag_name="$previous" --jq .body >> "$notes"
          fi
          gh release create "$VERSION" \
            dist/baize-agent-linux-amd64 \
            dist/baize-agent-linux-arm64 \
            dist/SHA256SUMS \
            --verify-tag \
            --title "Baize $VERSION" \
            --notes-file "$notes" \
            --latest="$PUBLISH_LATEST"
