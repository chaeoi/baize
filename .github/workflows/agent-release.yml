name: 自动发布 Baize

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: baize-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  version:
    name: 自动编号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.number.outputs.version }}
      released: ${{ steps.number.outputs.released }}
      skip: ${{ steps.number.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 计算版本并创建标签
        id: number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 - <<'PYCODE'
          import datetime
          import json
          import os
          import re
          import subprocess


          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()


          def parse_version(value):
              match = re.fullmatch(r"([2-9][0-9]{3})\.([1-9]|1[0-2])\.([1-9][0-9]*)", value)
              return tuple(map(int, match.groups())) if match else None


          def release(path):
              result = subprocess.run(["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/{path}"], text=True, capture_output=True)
              if result.returncode:
                  if "HTTP 404" in result.stderr:
                      return None
                  raise RuntimeError(result.stderr)
              return json.loads(result.stdout)


          def output(version="", released=False, skip=False):
              values = {"version": version, "released": str(released).lower(), "skip": str(skip).lower()}
              with open(os.environ["GITHUB_OUTPUT"], "a") as destination:
                  destination.write("".join(f"{name}={value}\n" for name, value in values.items()))


          head = os.environ["GITHUB_SHA"]
          date = datetime.datetime.fromisoformat(git("show", "-s", "--format=%cI", head)).astimezone(datetime.timezone.utc)
          prefix = (date.year, date.month)
          tags = []
          for line in git("for-each-ref", "--format=%(refname:strip=2) %(objectname) %(*objectname)", "refs/tags").splitlines():
              name, target, *peeled = line.split()
              number = parse_version(name)
              if number:
                  tags.append((number, peeled[0] if peeled else target))
          assigned = [number for number, target in tags if target == head]
          if assigned:
              number = max(assigned)
          else:
              # An older queued commit must not acquire a higher version than its successor.
              for target in {target for _, target in tags}:
                  result = subprocess.run(["git", "merge-base", "--is-ancestor", head, target])
                  if result.returncode == 0:
                      output(skip=True)
                      print("Skipping an unversioned commit superseded by a newer versioned commit.")
                      raise SystemExit(0)
                  if result.returncode != 1:
                      raise RuntimeError("cannot compare release commit ancestry")
              sequence = max((number[2] for number, _ in tags if number[:2] == prefix), default=0) + 1
              number = (*prefix, sequence)
          if not 0 < number[2] <= 4294967295:
              raise RuntimeError("release sequence is out of range")
          version = ".".join(map(str, number))
          if not assigned:
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subject = git("show", "-s", "--format=%s", head)
              subprocess.run(["git", "tag", "-a", "--cleanup=verbatim", version, head, "-m", f"## 更新内容\n\n- {subject}\n"], check=True)
              subprocess.run(["git", "push", "origin", f"refs/tags/{version}"], check=True)
          existing = release(f"tags/{version}")
          output(version, released=bool(existing and not existing["draft"]))
          print(f"Release version: {version}")
          PYCODE

  go-test:
    name: 测试 Go Agent
    needs: [version]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 设置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: 测试
        run: |
          go test ./...
          go vet ./...

  build-agent:
    name: 构建 Linux Agent (${{ matrix.arch }})
    needs: [version, go-test]
    if: needs.version.outputs.skip != 'true' && needs.version.outputs.released != 'true'
    env:
      VERSION: ${{ needs.version.outputs.version }}
    runs-on: ${{ matrix.runner }}
    container: ros:humble-ros-base-jammy
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装构建依赖
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ros-humble-ament-cmake ros-humble-rclcpp \
            ros-humble-sensor-msgs ros-humble-diagnostic-msgs

      - name: 设置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建静态 Agent
        shell: bash
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          set -eo pipefail
          . /opt/ros/humble/setup.bash
          cmake -S agent/ros2_subscriber -B "$RUNNER_TEMP/baize-ros2-subscriber" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/baize-ros2-subscriber" --parallel
          subscriber="$RUNNER_TEMP/baize-ros2-subscriber/baize-ros2-subscriber"
          ldd "$subscriber" | tee "$RUNNER_TEMP/baize-ros2-subscriber-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/baize-ros2-subscriber-ldd.txt"; then
            exit 1
          fi
          cp "$subscriber" agent/internal/service/baize-ros2-subscriber
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux go build \
            -trimpath -buildvcs=false -tags netgo,osusergo \
            -ldflags="-s -w -buildid= -X main.version=$VERSION" \
            -o "dist/baize-agent-linux-$GOARCH" ./agent/cmd/baize-agent
          "dist/baize-agent-linux-$GOARCH" -version

      - name: 上传 Agent
        uses: actions/upload-artifact@v7
        with:
          name: baize-agent-${{ matrix.arch }}
          path: dist/baize-agent-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  dashboard:
    name: 发布 Dashboard
    needs: [version, go-test]
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  release:
    name: 发布 GitHub Release
    needs: [version, build-agent, dashboard]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.skip != 'true' && (needs.build-agent.result == 'success' || (needs.build-agent.result == 'skipped' && needs.version.outputs.released == 'true')) && needs.dashboard.result == 'success' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRODUCT_NAME: Baize
      ASSET_PREFIX: baize-agent
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 下载构建产物
        if: needs.version.outputs.released != 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: baize-agent-*
          merge-multiple: true
          path: dist

      - name: 生成校验和
        if: needs.version.outputs.released != 'true'
        run: |
          set -euo pipefail
          (cd dist && sha256sum baize-agent-linux-* > SHA256SUMS)

      - name: 发布或恢复 Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          python3 - <<'PYCODE'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess


          def gh(*args):
              return subprocess.check_output(["gh", *args], text=True).strip()


          def number(tag):
              if re.fullmatch(r"[2-9][0-9]{3}\.([1-9]|1[0-2])\.[1-9][0-9]*", tag):
                  return tuple(map(int, tag.split(".")))
              return None


          def releases():
              pages = json.loads(gh("api", "--paginate", "--slurp", f"repos/{repository}/releases?per_page=100"))
              return [release for page in pages for release in page]


          def published_versions(items):
              return [
                  number(item["tag_name"])
                  for item in items
                  if not item["draft"] and not item["prerelease"] and number(item["tag_name"])
              ]


          def validate_assets(release, local=False):
              assets = {asset["name"]: asset for asset in release["assets"]}
              if set(assets) != set(files) or len(release["assets"]) != len(files):
                  raise RuntimeError("release attachments are incomplete")
              for name, asset in assets.items():
                  if asset["state"] != "uploaded" or asset["size"] <= 0:
                      raise RuntimeError(f"release attachment is not ready: {name}")
                  if local and asset["digest"] != "sha256:" + hashlib.sha256(Path("dist", name).read_bytes()).hexdigest():
                      raise RuntimeError(f"release attachment checksum mismatch: {name}")


          repository = os.environ["GITHUB_REPOSITORY"]
          version = os.environ["VERSION"]
          product = os.environ["PRODUCT_NAME"]
          stem = os.environ["ASSET_PREFIX"]
          files = [f"{stem}-linux-amd64", f"{stem}-linux-arm64", "SHA256SUMS"]
          if subprocess.check_output(["git", "rev-parse", f"refs/tags/{version}^{{commit}}"], text=True).strip() != os.environ["GITHUB_SHA"]:
              raise RuntimeError("release tag belongs to another commit")
          all_releases = releases()
          existing = next((item for item in all_releases if item["tag_name"] == version), None)
          if not existing or existing["draft"]:
              for name in files:
                  if not Path("dist", name).is_file():
                      raise RuntimeError(f"missing release artifact: {name}")
              notes = subprocess.check_output(["git", "for-each-ref", "--format=%(contents)", f"refs/tags/{version}"], text=True).strip()
              notes += "\n\n## 安装与升级\n\n"
              documentation = f"https://github.com/{repository}/blob/{version}/README.md"
              image = f"{os.environ['DOCKERHUB_USERNAME']}/baize:{version}"
              notes += f"- Dashboard 镜像：`{image}`\n- Agent 安装、配置和服务管理：[部署文档]({documentation}#agent)。\n"
              notes += "\n## 下载\n\n| Linux 架构 | 程序 |\n|---|---|\n"
              for arch in ["amd64", "arm64"]:
                  name = f"{stem}-linux-{arch}"
                  notes += f"| {arch} | [{name}](https://github.com/{repository}/releases/download/{version}/{name}) |\n"
              notes += "\nAgent 已内嵌 ROS2 订阅器。机器人需要 ROS2 Humble 运行环境。\n"
              notes += "\n## SHA-256\n\n下载附件 `SHA256SUMS` 后，可用 `sha256sum --check --ignore-missing SHA256SUMS` 校验。\n\n```text\n"
              notes += Path("dist/SHA256SUMS").read_text() + "```\n"
              previous = max((value for value in published_versions(all_releases) if value < number(version)), default=None)
              if previous:
                  previous_tag = ".".join(map(str, previous))
                  generated = json.loads(gh("api", "--method", "POST", f"repos/{repository}/releases/generate-notes", "-f", f"tag_name={version}", "-f", f"previous_tag_name={previous_tag}"))
                  notes += "\n" + generated["body"] + "\n"
              notes_file = Path(os.environ["RUNNER_TEMP"], "release-notes.md")
              notes_file.write_text(notes)
              if existing:
                  gh("release", "edit", version, "--title", f"{product} {version}", "--notes-file", str(notes_file))
              else:
                  gh("release", "create", version, "--draft", "--verify-tag", "--title", f"{product} {version}", "--notes-file", str(notes_file))
              # Draft attachments can be replaced; published attachments are never uploaded again.
              gh("release", "upload", version, *(f"dist/{name}" for name in files), "--clobber")
              existing = next(item for item in releases() if item["tag_name"] == version)
              validate_assets(existing, local=True)
              gh("release", "edit", version, "--draft=false", "--latest=false")
          else:
              validate_assets(existing)

          # Failed-job reruns reuse earlier job outputs, so decide latest here from published releases.
          all_releases = releases()
          promote = number(version) == max(published_versions(all_releases))
          if promote:
              latest = subprocess.run(["gh", "api", f"repos/{repository}/releases/latest"], text=True, capture_output=True)
              if latest.returncode and "HTTP 404" not in latest.stderr:
                  raise RuntimeError(latest.stderr)
              if latest.returncode or json.loads(latest.stdout)["tag_name"] != version:
                  gh("release", "edit", version, "--latest")
          with open(os.environ["GITHUB_OUTPUT"], "a") as destination:
              destination.write(f"latest={str(promote).lower()}\n")
          print(f"Published {version}; latest={str(promote).lower()}")
          PYCODE

      - name: 设置 Docker Buildx
        if: steps.publish.outputs.latest == 'true'
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        if: steps.publish.outputs.latest == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 更新 Dashboard latest
        if: steps.publish.outputs.latest == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          image="$DOCKERHUB_USERNAME/baize"
          docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
