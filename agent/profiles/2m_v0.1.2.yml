# Robot profiles describe data transport and decoding only. They cannot execute
# arbitrary commands; the agent selects one of its audited adapters by source.
motor:
  enabled: true
  source: ros2_topic
  topic: /motor/joint_states
  message_type: sensor_msgs/msg/JointState
  ros_setup:
    - /opt/ros/humble/setup.bash
    - /opt/baize/agent/ros/setup.bash
  read_timeout: 3s

bms:
  enabled: true
  source: can_query
  protocol: yy-bcu14h-mos-24s100a
  can_interface: can5
  timeout: 5s
  query_interval: 2s
  can_queries:
    - name: pack
      request_id: 0x0400ff80
      response_id: 0x04028001
      fields:
        - { name: voltage, offset: 0, length: 2, encoding: uint, endian: big, scale: 0.1 }
        - { name: current, offset: 2, length: 2, encoding: uint, endian: big, scale: 0.1, bias: -3000 }
        - { name: soc_percent, offset: 4, length: 2, encoding: uint, endian: big, scale: 0.1 }
    - name: status
      request_id: 0x0400ff80
      response_id: 0x04078001
      fields:
        - { name: power_supply_status, offset: 0, length: 1, encoding: enum }
    - name: power
      request_id: 0x0400ff80
      response_id: 0x04038001
      fields:
        - { name: power_watts, offset: 0, length: 2, encoding: int, endian: big, scale: 1 }
        - { name: total_energy_wh, offset: 2, length: 2, encoding: uint, endian: big, scale: 1 }
        - { name: mos_celsius, offset: 4, length: 1, encoding: uint, scale: 1, bias: -40 }
        - { name: board_celsius, offset: 5, length: 1, encoding: uint, scale: 1, bias: -40 }
        - { name: heater_celsius, offset: 6, length: 1, encoding: uint, scale: 1, bias: -40 }
    - name: cell
      request_id: 0x0400ff80
      response_id: 0x04048001
      fields:
        - { name: max_cell_voltage, offset: 0, length: 2, encoding: uint, endian: big, scale: 0.001 }
        - { name: min_cell_voltage, offset: 3, length: 2, encoding: uint, endian: big, scale: 0.001 }
        - { name: cell_voltage_delta, offset: 6, length: 2, encoding: uint, endian: big, scale: 0.001 }
    - name: temperature
      request_id: 0x0400ff80
      response_id: 0x04058001
      fields:
        - { name: max_cell_temperature, offset: 0, length: 1, encoding: uint, scale: 1, bias: -40 }
        - { name: min_cell_temperature, offset: 2, length: 1, encoding: uint, scale: 1, bias: -40 }
        - { name: cell_temperature_delta, offset: 4, length: 1, encoding: uint, scale: 1 }
    - name: pack_info
      request_id: 0x0400ff80
      response_id: 0x04088001
      fields:
        - { name: cell_count, offset: 0, length: 1, encoding: uint, scale: 1 }
        - { name: temperature_count, offset: 1, length: 1, encoding: uint, scale: 1 }
        - { name: remaining_capacity_ah, offset: 2, length: 4, encoding: uint, endian: big, scale: 0.001 }
        - { name: cycle_count, offset: 6, length: 2, encoding: uint, endian: big, scale: 1 }
    - name: fault
      request_id: 0x0400ff80
      response_id: 0x04098001
      fields:
        - name: faults
          offset: 0
          length: 8
          encoding: bits
          bit_names:
            - cell_overvoltage_l1
            - cell_overvoltage_l2
            - cell_undervoltage_l1
            - cell_undervoltage_l2
            - pack_overvoltage_l1
            - pack_overvoltage_l2
            - pack_undervoltage_l1
            - pack_undervoltage_l2
            - charge_overtemp_l1
            - charge_overtemp_l2
            - charge_undertemp_l1
            - charge_undertemp_l2
            - discharge_overtemp_l1
            - discharge_overtemp_l2
            - discharge_undertemp_l1
            - discharge_undertemp_l2
            - charge_overcurrent_l1
            - charge_overcurrent_l2
            - discharge_overcurrent_l1
            - discharge_overcurrent_l2
            - soc_high_l1
            - soc_high_l2
            - soc_low_l1
            - soc_low_l2
            - cell_delta_high_l1
            - cell_delta_high_l2
            - temp_delta_high_l1
            - temp_delta_high_l2
            - mos_overtemp_l1
            - mos_overtemp_l2
            - board_overtemp_l1
            - board_overtemp_l2
            - charge_mos_overtemp
            - discharge_mos_overtemp
            - charge_mos_sensor_fault
            - discharge_mos_sensor_fault
            - charge_mos_stuck
            - discharge_mos_stuck
            - charge_mos_open
            - discharge_mos_open
            - afe_fault
            - cell_acquisition_offline
            - cell_temp_sensor_fault
            - eeprom_fault
            - rtc_fault
            - precharge_failed
            - vehicle_communication_fault
            - internal_communication_fault
            - current_module_fault
            - pack_voltage_module_fault
            - short_circuit
            - low_voltage_charge_inhibit
            - external_mos_shutdown
            - charger_removed
            - thermal_runaway
            - heater_fault
            - balance_communication_fault
            - balance_condition_not_met
            - reserved
            - reserved
            - reserved
            - reserved
            - reserved
            - reserved
    - name: health
      request_id: 0x0400ff80
      response_id: 0x040d8001
      fields:
        - { name: soh_percent, offset: 3, length: 2, encoding: uint, endian: big, scale: 1 }
  publish_ros2: false
  ros_topic: /bms_can/battery_data
  ros_message_type: sensor_msgs/msg/BatteryState
  ros_setup:
    - /opt/ros/humble/setup.bash
    - /opt/baize/agent/ros/setup.bash
  publish_interval: 2s
  publish_timeout: 4s
  specification:
    pack_model: YY-BCU14H-MOS-24S100A
    series_cells: 24
